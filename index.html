<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Study Planner</title>
  <meta name="description" content="Your assignments, reminders and grades in one place.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f9">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1115">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Planner">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <h1 class="brand"><img src="icons/icon.svg" alt="" width="26" height="26">Study Planner</h1>
        <nav class="tabs" aria-label="Sections">
          <button class="tab" type="button" data-tab="upcoming" aria-current="page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5"/></svg>
            <span>Upcoming</span>
          </button>
          <button class="tab" type="button" data-tab="grades">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M6 16v-5M11 16V5M16 16V9M21 16v-3"/></svg>
            <span>Grades</span>
          </button>
          <button class="tab" type="button" data-tab="settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></svg>
            <span>Settings</span>
          </button>
        </nav>
      </div>
    </header>
    <main id="view" class="view"></main>
  </div>
  <dialog id="sheet" class="sheet" aria-label="Assignment"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
